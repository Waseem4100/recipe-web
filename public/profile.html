<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Profile – RecipeHub</title><link rel="stylesheet" href="/css/style.css"></head><body>
<main class="wrap"><div id="root"></div></main>
<script src="/js/app.js"></script>
<script>
renderLayout('profile');
const root = document.getElementById('root');

function authView() {
  root.innerHTML = `
  <div class="page-head"><h1>Log in or create an account</h1></div>
  <div class="auth-grid" style="margin-top:1.5rem">
    <form class="form-card" id="login" style="margin:0"><h2>Log in</h2>
      <label for="le">Email</label><input id="le" type="email" required autocomplete="email">
      <label for="lp">Password</label><input id="lp" type="password" required autocomplete="current-password">
      <div id="lmsg"></div><button class="btn" style="margin-top:1.2rem">Log in</button></form>
    <form class="form-card" id="register" style="margin:0"><h2>Register</h2>
      <label for="rn">Name</label><input id="rn" required autocomplete="name">
      <label for="re">Email</label><input id="re" type="email" required autocomplete="email">
      <label for="rp">Password <span class="hint">(6+ characters)</span></label><input id="rp" type="password" minlength="6" required autocomplete="new-password">
      <div id="rmsg"></div><button class="btn alt" style="margin-top:1.2rem">Create account</button></form>
  </div>`;
  login.addEventListener('submit', async e => { e.preventDefault();
    try { Auth.save(await api('/auth/login', { method: 'POST', body: { email: le.value, password: lp.value } })); location.reload(); }
    catch (err) { showMsg(lmsg, err.message); } });
  register.addEventListener('submit', async e => { e.preventDefault();
    try { Auth.save(await api('/auth/register', { method: 'POST', body: { name: rn.value, email: re.value, password: rp.value } })); location.reload(); }
    catch (err) { showMsg(rmsg, err.message); } });
}

async function profileView() {
  const u = Auth.user;
  root.innerHTML = `<div class="page-head" style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:1rem">
    <div><h1>Hi, ${esc(u.name)}</h1><p style="color:var(--muted)">${esc(u.email)}</p></div>
    <div style="display:flex;gap:.6rem"><a class="btn" href="/submit.html">Submit a recipe</a><button class="btn ghost" id="out">Log out</button></div></div>
    <section class="block"><h2>Your recipes</h2><div class="grid" id="mine"><p class="empty">Loading…</p></div></section>`;
  document.getElementById('out').onclick = () => { Auth.clear(); location.reload(); };
  const mine = document.getElementById('mine');
  try {
    const list = await api('/recipes?mine=1');
    mine.innerHTML = list.length ? list.map(recipeCard).join('') : '<p class="empty">You haven’t shared a recipe yet. <a href="/submit.html"><u>Submit your first one</u></a>.</p>';
  } catch (err) { if (/session/i.test(err.message)) { Auth.clear(); location.reload(); } mine.innerHTML = `<p class="empty">${esc(err.message)}</p>`; }
}
Auth.token ? profileView() : authView();
</script></body></html>
